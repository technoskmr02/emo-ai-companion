<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>EMO AI Companion</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }

    /* Main face area */
    .face {
      width: 100vw;
      height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #000;
    }

    /* Two eyes */
    .eyes {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: clamp(22px, 6vw, 55px);

      width: 100%;
      padding: 20px;
    }

    /* EMO-style rounded rectangular LED eye */
    .eye {
      width: clamp(70px, 24vw, 125px);
      height: clamp(105px, 34vw, 165px);

      background: #168cff;

      border-radius: 28px;

      box-shadow:
        0 0 10px #168cff,
        0 0 25px #168cff,
        0 0 55px rgba(22, 140, 255, 0.75);

      transition:
        width 0.25s ease,
        height 0.25s ease,
        border-radius 0.25s ease,
        transform 0.25s ease,
        box-shadow 0.25s ease,
        opacity 0.2s ease;

      animation: idleGlow 2.5s ease-in-out infinite;
    }

    /* Gentle idle glow */
    @keyframes idleGlow {
      0%, 100% {
        opacity: 0.94;
        filter: brightness(1);
      }

      50% {
        opacity: 1;
        filter: brightness(1.12);
      }
    }

    /* Blink */
    .blink .eye {
      height: 12px;
      border-radius: 10px;
      transform: translateY(2px);
    }

    /* Happy */
    .happy .eye {
      height: 85px;
      border-radius: 35px 35px 22px 22px;
    }

    /* Sad */
    .sad .eye {
      transform: rotate(-8deg);
      border-radius: 35px 20px 30px 35px;
    }

    /* Angry */
    .angry .eye:first-child {
      transform: rotate(10deg);
    }

    .angry .eye:last-child {
      transform: rotate(-10deg);
    }

    /* Surprised */
    .surprised .eye {
      width: clamp(85px, 27vw, 140px);
      height: clamp(125px, 38vw, 180px);
      border-radius: 35px;
    }

    /* Sleepy */
    .sleepy .eye {
      height: 45px;
      border-radius: 25px;
      opacity: 0.7;
    }

    /* Listening */
    .listening .eye {
      animation:
        listenPulse 0.9s ease-in-out infinite alternate;
    }

    @keyframes listenPulse {
      from {
        transform: scaleY(0.9);
        filter: brightness(1);
      }

      to {
        transform: scaleY(1.08);
        filter: brightness(1.3);
      }
    }

    /* Thinking */
    .thinking .eye {
      animation:
        thinkingMove 1.2s ease-in-out infinite alternate;
    }

    @keyframes thinkingMove {
      from {
        transform: translateY(-4px);
      }

      to {
        transform: translateY(5px);
      }
    }

    /* Excited */
    .excited .eye {
      animation:
        excitedBounce 0.45s ease-in-out infinite alternate;
    }

    @keyframes excitedBounce {
      from {
        transform: translateY(-5px) scale(1);
      }

      to {
        transform: translateY(5px) scale(1.06);
      }
    }

    /* Scared */
    .scared .eye {
      animation:
        scaredShake 0.15s linear infinite;
    }

    @keyframes scaredShake {
      0% {
        transform: translateX(-3px);
      }

      50% {
        transform: translateX(3px);
      }

      100% {
        transform: translateX(-3px);
      }
    }

    /* Speaking */
    .speaking .eye {
      animation:
        speakPulse 0.55s ease-in-out infinite alternate;
    }

    @keyframes speakPulse {
      from {
        transform: scaleY(0.94);
      }

      to {
        transform: scaleY(1.05);
      }
    }

    /* Starting animation */
    .starting .eye {
      opacity: 0;
      transform: scaleY(0.1);
    }

    /* Mobile */
    @media (max-width: 600px) {
      .eyes {
        gap: 24px;
      }

      .eye {
        border-radius: 24px;
      }
    }

    /* Very small screens */
    @media (max-width: 360px) {
      .eyes {
        gap: 18px;
      }

      .eye {
        width: 65px;
        height: 100px;
      }
    }
  </style>
</head>

<body>

  <main class="face" id="face">
    <div class="eyes">
      <div class="eye"></div>
      <div class="eye"></div>
    </div>
  </main>

  <script>
    const face = document.getElementById("face");

    /*
      Change expression:
      normal
      blink
      happy
      sad
      angry
      surprised
      sleepy
      listening
      thinking
      speaking
      excited
      scared
    */

    function setExpression(name, duration = 0) {
      face.className = "face " + name;

      if (duration > 0) {
        setTimeout(() => {
          setExpression("normal");
        }, duration);
      }
    }

    /* Start */
    setExpression("starting");

    setTimeout(() => {
      setExpression("normal");
    }, 900);

    /* Automatic blinking */
    function autoBlink() {
      const delay = 2500 + Math.random() * 3500;

      setTimeout(() => {
        if (
          !face.classList.contains("listening") &&
          !face.classList.contains("speaking")
        ) {
          setExpression("blink");

          setTimeout(() => {
            setExpression("normal");
          }, 130);
        }

        autoBlink();
      }, delay);
    }

    autoBlink();

    /* Demo expression cycle */
    const demoExpressions = [
      ["happy", 1200],
      ["surprised", 900],
      ["thinking", 1300],
      ["sad", 1000],
      ["angry", 900],
      ["excited", 1100],
      ["normal", 1500]
    ];

    let demoIndex = 0;

    function demoLoop() {
      const [expression, duration] =
        demoExpressions[demoIndex];

      setExpression(expression);

      demoIndex++;

      if (demoIndex >= demoExpressions.length) {
        demoIndex = 0;
      }

      setTimeout(demoLoop, duration);
    }

    /* Start demo after initial startup */
    setTimeout(demoLoop, 2500);

    /*
      Test from browser console:

      setExpression("happy", 1500);
      setExpression("angry", 1500);
      setExpression("surprised", 1500);
      setExpression("listening");
      setExpression("normal");
    */
  </script>

</body>
</html>
